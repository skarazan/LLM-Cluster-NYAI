services:
  searxng:
    image: searxng/searxng:latest
    container_name: llm-cluster-searxng
    restart: unless-stopped
    # Bind to localhost only — the manager is the sole consumer.
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
