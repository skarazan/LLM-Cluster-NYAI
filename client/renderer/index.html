<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Cluster Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">LLM Cluster Chat</div>
    <div class="connection">
      <label for="backend-url">Manager URL:</label>
      <input id="backend-url" type="text" placeholder="http://192.168.1.x:3000" />
      <button id="discover-btn" class="secondary">Discover</button>
      <select id="discovered" class="hidden"></select>
      <select id="model">
        <option value="qwen3.6-35b-a3b">qwen3.6-35B-A3B (MoE)</option>
        <option value="qwen3.6">qwen3.6 (27B-Q3)</option>
        <option value="qwen2.5-coder">qwen2.5-coder</option>
        <option value="qwen2.5">qwen2.5</option>
        <option value="llama3.1">llama3.1</option>
        <option value="llama3">llama3</option>
        <option value="mistral">mistral</option>
      </select>
      <button id="ping-btn">Test</button>
      <span id="status-dot" class="dot dot-unknown" title="not tested"></span>
    </div>

    <!-- Mode toggle -->
    <div class="mode-toggle" title="Switch between Chat and Code (agentic) mode">
      <button id="mode-chat" class="mode-btn active">Chat</button>
      <button id="mode-code" class="mode-btn">Code</button>
    </div>

    <!-- Code mode controls (hidden in Chat mode) -->
    <div id="code-controls" class="code-controls hidden">
      <button id="workspace-btn" class="secondary">Workspace: <span id="workspace-label">none</span></button>
      <select id="approval-mode">
        <option value="strict">Strict</option>
        <option value="trusted">Trusted</option>
        <option value="yolo">Yolo ⚡</option>
      </select>
      <label class="plan-toggle"><input type="checkbox" id="plan-mode"> Plan</label>
      <button id="todo-btn" class="secondary">Todo</button>
      <button id="stop-btn" class="stop-btn hidden">■ Stop</button>
    </div>

    <div id="session-tokens" class="session-tokens">in: 0 · out: 0</div>
  </header>

  <div id="update-banner" class="update-banner hidden">
    <span id="update-msg"></span>
    <button id="update-btn">Download update</button>
    <button id="update-dismiss">✕</button>
  </div>

  <div class="workspace-main">
    <main id="chat" class="chat"></main>
    <aside id="activity-panel" class="activity-panel hidden">
      <div class="activity-panel-header">
        <div>
          <div id="activity-title" class="activity-title">Activity</div>
          <div id="activity-subtitle" class="activity-subtitle">Select an activity to inspect details.</div>
        </div>
        <button id="activity-close" class="activity-close" title="Close details">×</button>
      </div>
      <pre id="activity-detail" class="activity-detail"></pre>
    </aside>
  </div>

  <footer>
    <textarea id="input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="2"></textarea>
    <button id="new-chat-btn">New Chat</button>
    <button id="send-btn">Send Message</button>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
